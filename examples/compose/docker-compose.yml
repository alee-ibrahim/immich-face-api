# immich-face-api next to an existing Immich started with Immich's own docker-compose.yml.
#
#   1. Create the read-only role in Immich's database (once), then set its password interactively:
#        docker exec -i immich_postgres psql -U postgres -d immich < ../readonly-role.sql
#        docker exec -it immich_postgres psql -U postgres -d immich
#          immich=# \password immich_face_api
#      and write the same password into ./db_password.txt (chmod 600).
#   2. cp .env.example .env and fill it in (owner id: Immich -> Administration -> Users -> the user; the id is in the URL).
#   3. Create a client key and its hash (see README "API keys") and write {"my-client": "<hash>"} to ./api-keys.json.
#   4. docker compose up -d, then: curl -s localhost:8080/readyz
#
# The service joins Immich's network so it can reach "immich-machine-learning" and "database" by name. That network is
# "<immich compose project>_default", usually "immich_default" (see: docker network ls).
name: immich-face-api

services:
  face-api:
    image: ghcr.io/alee-ibrahim/immich-face-api:main   # pin a version (or a digest) in production
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=16m"]
    env_file: .env
    environment:
      FACE_API_ML_URL: http://immich-machine-learning:3003
      FACE_API_DB_HOST: database
      FACE_API_DB_SSLMODE: disable          # inside the Docker network only; use verify-full with TLS elsewhere
      FACE_API_DB_PASSWORD_FILE: /run/secrets/db_password
      FACE_API_API_KEYS_FILE: /run/secrets/api_keys
    secrets: [db_password, api_keys]
    ports:
      - "127.0.0.1:8080:8080"   # put a TLS reverse proxy in front; never publish it bare
    networks: [immich]

  # ---- optional: admin UI + its own store (docker compose --profile admin up -d) ----------------------------
  # Keys made in the UI and usage analytics live in face-store (NOT Immich's database). To let the API above accept
  # UI-made keys and record usage too, give it the same FACE_API_STORE_URL / FACE_API_STORE_PASSWORD_FILE.
  face-store:
    profiles: [admin]
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: face_api
      POSTGRES_USER: face_api
      POSTGRES_PASSWORD_FILE: /run/secrets/store_password
    secrets: [store_password]
    volumes: [face-store:/var/lib/postgresql]
    networks: [immich]

  face-admin:
    profiles: [admin]
    image: ghcr.io/alee-ibrahim/immich-face-api:main
    command: ["admin"]
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=16m"]
    env_file: .env
    environment:
      FACE_API_ML_URL: http://immich-machine-learning:3003
      FACE_API_DB_HOST: database
      FACE_API_DB_SSLMODE: disable
      FACE_API_DB_PASSWORD_FILE: /run/secrets/db_password
      FACE_API_STORE_URL: postgresql://face_api@face-store:5432/face_api
      FACE_API_STORE_PASSWORD_FILE: /run/secrets/store_password
      FACE_API_ADMIN_TOKEN_FILE: /run/secrets/admin_token     # or FACE_API_OIDC_* for single sign-on
      FACE_API_SESSION_HTTPS_ONLY: "false"                    # local plain HTTP only
    secrets: [db_password, store_password, admin_token]
    ports:
      - "127.0.0.1:8081:8081"   # admin UI: keep it local or on an internal network, never public
    depends_on: [face-store]
    networks: [immich]

secrets:
  store_password:
    file: ./store_password.txt
  admin_token:
    file: ./admin_token.txt
  db_password:
    file: ./db_password.txt
  api_keys:
    file: ./api-keys.json

volumes:
  face-store:

networks:
  immich:
    name: ${IMMICH_NETWORK:-immich_default}
    external: true
