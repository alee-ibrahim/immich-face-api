# Standard NetworkPolicy: in only from your ingress controller and Prometheus; out only to DNS, Immich's database and
# Immich's machine-learning server. Adjust every selector to your cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: immich-face-api
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: immich-face-api }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
      ports: [{ port: 8080, protocol: TCP }]
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
      ports: [{ port: 9090, protocol: TCP }]
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: immich-postgres }
      ports: [{ port: 5432, protocol: TCP }]
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: immich-machine-learning }
      ports: [{ port: 3003, protocol: TCP }]
